{% set name = "trio-websocket" %}
{% set version = "0.12.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
    url: https://github.com/HyperionGray/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: 4784c823dbe98e4dc3909b560857c64f5786bca01d00d16f2e3ae37a32a54174

build:
  number: 0
  skip: True  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv

requirements:
  host:
    - pip
    - python
    - wheel
  run:
    - python
    - trio >=0.11
    - wsproto >=0.14
    - exceptiongroup # [py<311]
    - outcome >=1.2.0

test:
  source_files:
    - pytest.ini
    - tests
  imports:
    - trio_websocket
  commands:
    - pip check
    - pytest -vv  # [not arm64 and win]
    - pytest -vv . -k "not test_client_close_timeout"  # [win]
    ## Skipped tests on osx-arm64 due to our CI limitations with networking libraries
  requires:
    - attrs >=19.2.0
    - pip
    - pytest >=4.6
    - trustme
    - pytest-trio >=0.5.0

about:
  home: https://github.com/HyperionGray/trio-websocket
  summary: WebSocket library for Trio
  license: MIT
  description: |
    trio-websocket is a WebSocket library for Trio. It is a port of the
    wsproto library to Trio, and is designed to be used with the Trio async
    I/O library.
  # TODO: revisit if/after merge of https://github.com/HyperionGray/trio-websocket/pull/168
  license_file: LICENSE
  license_family: MIT
  doc_url: https://trio-websocket.readthedocs.io
  dev_url: https://github.com/HyperionGray/trio-websocket

extra:
  recipe-maintainers:
    - bollwyvl
